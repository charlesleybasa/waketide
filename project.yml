name: Waketide
options:
  bundleIdPrefix: com.waketide
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer Team ID here, or pick it in Xcode > Signing & Capabilities.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
targets:
  Waketide:
    type: application
    platform: iOS
    sources:
      - path: Waketide
    info:
      path: Waketide/Info.plist
      properties:
        CFBundleDisplayName: Waketide
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
        NSAlarmKitUsageDescription: "Waketide schedules your alarms and timers so they ring even when your iPhone is silent or in a Focus."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waketide.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: WaketideWidget
  WaketideWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WaketideWidget
      - path: Waketide/Shared
      - path: Waketide/Fonts
        includes: ["*.ttf"]
    info:
      path: WaketideWidget/Info.plist
      properties:
        CFBundleDisplayName: Waketide Live Activity
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - BricolageGrotesque-Medium.ttf
          - BricolageGrotesque-Bold.ttf
          - BricolageGrotesque-ExtraBold.ttf
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waketide.app.widget
        GENERATE_INFOPLIST_FILE: NO
  WaketideTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WaketideTests
    dependencies:
      - target: Waketide
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waketide.app.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Waketide:
    build:
      targets:
        Waketide: all
        WaketideWidget: all
    test:
      targets:
        - WaketideTests
