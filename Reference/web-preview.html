<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Waketide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{
  --ink:#1c1a33; --ink2:#4a4868; --indigo:#4f46d8; --violet:#8a86f8; --mint:#8fe8d8; --peach:#ffc7a0; --coral:#e8557a;
  --ground:#efe9f7; --glass-a:rgba(255,255,255,.72); --glass-b:rgba(255,255,255,.34); --edge:rgba(255,255,255,.85);
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif; --body:'DM Sans',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--indigo);outline-offset:2px}
.app{position:relative;height:100%;max-width:430px;margin:0 auto;overflow:hidden;background:var(--ground)}
.aurora{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(46px);animation:drift 18s ease-in-out infinite alternate}
.b1{left:-90px;top:-70px;width:340px;height:340px;background:#a3a4f9;opacity:.9}
.b2{right:-100px;top:24%;width:300px;height:300px;background:#8fe8d8;opacity:.7;animation-duration:22s}
.b3{left:-60px;bottom:8%;width:340px;height:340px;background:#ffc7a0;opacity:.8;animation-duration:25s}
.b4{right:-40px;bottom:-60px;width:260px;height:260px;background:#f7b0da;opacity:.6;animation-duration:20s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(28px,-36px) scale(1.14)}}
.glass{background:linear-gradient(135deg,var(--glass-a),var(--glass-b));-webkit-backdrop-filter:blur(22px) saturate(1.7);backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--edge);box-shadow:0 10px 30px rgba(80,60,160,.14),inset 0 1px 1px rgba(255,255,255,.95),inset 0 -10px 20px rgba(255,255,255,.16)}
.screen{position:absolute;inset:0;overflow-y:auto;padding:14px 16px 128px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.hdr{display:flex;align-items:center;justify-content:space-between;min-height:48px;flex:none}
.ttl{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;line-height:1}
.hbtns{display:flex;gap:8px}
.ib{width:44px;height:44px;border-radius:50%;display:inline-grid;place-items:center;flex:none;background:rgba(255,255,255,.55);border:1px solid var(--edge);color:#38366a;box-shadow:inset 0 1px 1px #fff,0 4px 12px rgba(80,60,160,.12);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.ib:active{transform:scale(.9)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2)}
.days{display:flex;padding:6px;border-radius:26px;flex:none}
.day{position:relative;flex:1;height:64px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);font-size:12px;font-weight:600;transition:background .3s,color .3s}
.day b{font-family:var(--display);font-size:20px;font-weight:700}
.day.on{background:linear-gradient(160deg,#7d7cf5,#4f46d8);color:#fff;box-shadow:0 8px 20px rgba(79,70,216,.4),inset 0 1px 1px rgba(255,255,255,.55);animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{from{transform:scale(.85)}to{transform:scale(1)}}
.pip{width:5px;height:5px;border-radius:50%;background:transparent}
.pip.y{background:var(--indigo)}
.day.on .pip.y{background:#fff}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;flex:none;min-height:104px}
.hero .big{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:4px}
.hero .sub{font-size:14px;font-weight:500;color:var(--ink2);margin-top:4px}
.heroblob{position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:44% 56% 52% 48%;background:radial-gradient(circle at 30% 30%,rgba(138,134,248,.65),rgba(143,232,216,.35));filter:blur(8px);animation:morph 9s ease-in-out infinite alternate}
@keyframes morph{0%{border-radius:44% 56% 52% 48%;transform:rotate(0)}100%{border-radius:58% 42% 40% 60%;transform:rotate(40deg)}}
.cnt{position:relative;width:64px;height:64px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(255,255,255,.65);box-shadow:inset 0 1px 2px #fff,0 6px 16px rgba(79,70,216,.25)}
.cnt b{font-family:var(--display);font-size:24px;line-height:1;font-weight:800;color:var(--indigo)}
.cnt span{font-size:11px;font-weight:700;color:var(--ink2)}
.list{position:relative;display:flex;flex-direction:column;gap:12px;padding-left:28px}
.list::before{content:"";position:absolute;left:8px;top:20px;bottom:20px;width:3px;border-radius:2px;background:linear-gradient(180deg,rgba(79,70,216,.55),rgba(79,70,216,.1))}
.item{position:relative}
.item.fresh{animation:rise .5s cubic-bezier(.34,1.56,.64,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
.dot{position:absolute;left:-26px;top:37px;width:14px;height:14px;border-radius:50%;background:rgba(255,255,255,.9);border:2px solid rgba(79,70,216,.4)}
.dot.on{background:var(--indigo);border-color:#fff;box-shadow:0 0 0 4px rgba(79,70,216,.22)}
.acard{min-height:88px;border-radius:26px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px}
.acard.off{opacity:.7}
.ainfo{flex:1;min-width:0;text-align:left;padding:4px 0}
.atime{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.atime small{font-size:14px;font-weight:700;margin-left:3px;color:var(--ink2);letter-spacing:0}
.alabel{font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arep{font-size:12px;font-weight:700;color:var(--indigo)}
.tog{position:relative;width:52px;height:32px;border-radius:16px;border:1px solid var(--edge);background:rgba(110,108,150,.32);flex:none;transition:background .35s}
.tog::after{content:"";position:absolute;inset:-8px}
.tog i{position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(40,30,100,.35);transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.tog[aria-checked="true"]{background:linear-gradient(90deg,#6f6cf0,#9a7cf6)}
.tog[aria-checked="true"] i{transform:translateX(20px)}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:22px;font-family:var(--display);font-weight:700;font-size:15px;background:rgba(255,255,255,.6);border:1px solid var(--edge);box-shadow:inset 0 1px 1px #fff,0 4px 14px rgba(80,60,160,.12);transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.pill:active{transform:scale(.94)}
.pill.sel{background:linear-gradient(160deg,#7d7cf5,#4f46d8);color:#fff}
.cta{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;border-radius:29px;width:100%;color:#fff;font-family:var(--display);font-weight:700;font-size:18px;background:linear-gradient(150deg,#8a86f8,#4f46d8 60%,#7a52e6);border:1px solid rgba(255,255,255,.6);box-shadow:0 14px 30px rgba(79,70,216,.45),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -10px 16px rgba(60,40,180,.3)}
.cta::before{content:"";position:absolute;top:0;bottom:0;width:60px;left:-80px;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:sweep 3.6s ease-in-out infinite}
@keyframes sweep{0%{left:-80px}55%,100%{left:110%}}
.cta[disabled]{opacity:.5}
.ghost{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:24px;font-weight:700;width:100%;color:var(--coral);background:rgba(255,255,255,.5);border:1px solid var(--edge)}
.empty{text-align:center;padding:24px;border-radius:30px;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h3{font-family:var(--display);font-size:20px}
.empty p{font-size:14px;color:var(--ink2);font-weight:500}
.foot{font-size:12.5px;color:var(--ink2);text-align:center;font-weight:500;line-height:1.5;padding:0 8px}
.foot button{color:var(--indigo);font-weight:700;text-decoration:underline;min-height:32px}
.tabbar{position:absolute;left:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:calc(100% - 108px);height:68px;border-radius:34px;padding:6px;display:flex;gap:2px;z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:54px;border-radius:27px;color:var(--ink2);font-size:11px;font-weight:700;transition:background .4s}
.tab[aria-selected="true"]{color:#3a34c4;background:rgba(255,255,255,.8);box-shadow:inset 0 1px 1px #fff,0 4px 14px rgba(79,70,216,.28);animation:pop .55s cubic-bezier(.34,1.56,.64,1)}
.fab{position:absolute;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:68px;height:68px;border-radius:50%;display:grid;place-items:center;color:#fff;z-index:5;background:linear-gradient(150deg,#8a86f8,#4f46d8 60%,#7a52e6);border:1px solid rgba(255,255,255,.6);box-shadow:0 12px 28px rgba(79,70,216,.5),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -8px 14px rgba(60,40,180,.35);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.fab:active{transform:scale(.88) rotate(90deg)}
/* calendar */
.calcard{border-radius:30px;padding:10px 12px 12px;flex:none}
.calhead{display:flex;align-items:center;justify-content:space-between;min-height:48px}
.calhead h2{font-family:var(--display);font-size:20px;font-weight:700}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:2px}
.wd{height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--ink2)}
.cell{height:46px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-family:var(--display);font-size:17px;font-weight:700;transition:background .3s}
.cell em{display:flex;gap:2px;height:5px}
.cell em i{width:5px;height:5px;border-radius:50%;background:var(--indigo)}
.cell.today{color:var(--indigo)}
.cell.on{background:linear-gradient(160deg,#7d7cf5,#4f46d8);color:#fff;animation:pop .5s cubic-bezier(.34,1.56,.64,1)}
.cell.on em i{background:#fff}
.dayhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 4px}
.dayhead h2{font-family:var(--display);font-size:20px;font-weight:700}
/* plans */
.tl{position:relative;flex:none}
.hrow{position:absolute;left:0;right:0;height:64px;border-top:1px solid rgba(74,72,104,.2)}
.hrow span{position:absolute;left:0;top:-8px;width:52px;text-align:right;font-size:12px;font-weight:700;color:var(--ink2);background:transparent}
.blk{position:absolute;border-radius:20px;padding:8px 12px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:2px;border:1px solid var(--edge);box-shadow:0 8px 20px rgba(80,60,160,.14),inset 0 1px 1px rgba(255,255,255,.9)}
.blk b{font-family:var(--display);font-size:16px;font-weight:700;display:flex;gap:6px;align-items:center}
.blk span{font-size:12px;font-weight:500;color:var(--ink2)}
.tone0{background:linear-gradient(135deg,rgba(138,134,248,.7),rgba(138,134,248,.36))}
.tone1{background:linear-gradient(135deg,rgba(143,232,216,.8),rgba(143,232,216,.4))}
.tone2{background:linear-gradient(135deg,rgba(255,199,160,.85),rgba(255,199,160,.42))}
.nowline{position:absolute;height:2px;background:var(--coral);z-index:2}
.nowline::before{content:"";position:absolute;left:-6px;top:-5px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 5px rgba(232,85,122,.2)}
/* timer */
.vessel{position:relative;width:290px;height:290px;margin:4px auto 0;flex:none;border-radius:50%;background:linear-gradient(160deg,rgba(255,255,255,.7),rgba(255,255,255,.25));border:1px solid var(--edge);box-shadow:0 24px 50px rgba(80,60,180,.25),inset 0 2px 3px #fff,inset 0 -18px 30px rgba(255,255,255,.3)}
.vessel canvas{position:absolute;inset:0;width:100%;height:100%}
.vt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink);transition:color .4s;padding:0 24px;text-align:center}
.vt.lit{color:#fff;text-shadow:0 2px 12px rgba(30,20,110,.5)}
.vt b{font-family:var(--display);font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.vt span{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tinputs{display:flex;gap:8px;padding:12px;border-radius:28px}
.tinputs label{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--ink2)}
.tinputs input{width:100%;height:56px;border-radius:18px;border:1px solid var(--edge);background:rgba(255,255,255,.6);text-align:center;font-family:var(--display);font-size:26px;font-weight:700;color:var(--ink)}
.field{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 18px;border-radius:26px}
.field label{font-size:14px;font-weight:700;color:var(--ink2)}
.field input,.field select{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:500;outline:none;color:var(--ink)}
.ctrl{display:flex;justify-content:center;align-items:center;gap:28px}
.round{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.6);border:1px solid var(--edge);box-shadow:inset 0 1px 1px #fff,0 8px 20px rgba(80,60,160,.15);font-family:var(--display);font-weight:700;font-size:16px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.round:active{transform:scale(.9)}
.round.main{width:92px;height:92px;color:#fff;background:linear-gradient(150deg,#8a86f8,#4f46d8 60%,#7a52e6);box-shadow:0 14px 30px rgba(79,70,216,.5),inset 0 2px 2px rgba(255,255,255,.6),inset 0 -10px 16px rgba(60,40,180,.3)}
/* sheets */
.scrim{position:absolute;inset:0;background:rgba(28,26,51,.32);z-index:20;animation:fade .3s both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;top:28px;z-index:21;border-radius:32px 32px 0 0;background:linear-gradient(180deg,rgba(247,243,252,.96),rgba(239,233,247,.98));border:1px solid var(--edge);box-shadow:0 -20px 60px rgba(40,30,110,.3);display:flex;flex-direction:column;animation:up .5s cubic-bezier(.22,1.2,.36,1) both;overflow:hidden}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 4px;flex:none}
.sheet-h h2{font-family:var(--display);font-size:20px;font-weight:800}
.sheet-b{flex:1;overflow-y:auto;padding:8px 16px 32px;display:flex;flex-direction:column;gap:14px}
.aibar{display:flex;align-items:center;gap:10px;min-height:56px;border-radius:28px;padding:0 6px 0 18px}
.aibar input,.aibar textarea{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:15.5px;font-weight:500;resize:none}
.hint{font-size:13px;font-weight:500;color:var(--ink2);padding:0 8px}
.timein{width:100%;height:96px;border-radius:30px;text-align:center;font-family:var(--display);font-size:56px;font-weight:800;letter-spacing:-.02em;color:var(--ink);border:1px solid var(--edge);font-variant-numeric:tabular-nums}
.pills{display:flex;justify-content:space-between;gap:4px}
.dp{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.6);border:1px solid var(--edge);font-family:var(--display);font-weight:700;font-size:15px;transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.dp[aria-pressed="true"]{background:linear-gradient(160deg,#7d7cf5,#4f46d8);color:#fff;box-shadow:0 6px 16px rgba(79,70,216,.4);transform:scale(1.06)}
.card{border-radius:28px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;font-weight:500;font-size:16px}
.opt select,.opt input[type=date]{border:0;background:transparent;font-weight:700;color:var(--indigo);text-align:right;outline:none}
.res{display:flex;align-items:center;gap:12px;min-height:68px;padding:0 6px 0 14px;border-radius:24px;animation:rise .45s cubic-bezier(.34,1.56,.64,1) both}
.res .k{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;color:var(--indigo);background:rgba(79,70,216,.14);flex:none}
.res .t{flex:1;min-width:0}
.res b{display:block;font-size:16px;font-weight:700}
.res small{font-size:13px;font-weight:500;color:var(--ink2)}
.res.gone{opacity:.5}
.res.gone b{text-decoration:line-through}
.ex{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 16px;border-radius:20px;font-weight:500;text-align:left;width:100%}
.orb{width:52px;height:52px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff,#8a86f8 45%,#4f46d8 70%,#8fe8d8);box-shadow:0 6px 18px rgba(79,70,216,.45);animation:breathe 2.8s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.1)}}
/* toast */
.toasts{position:absolute;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:30;pointer-events:none;padding:0 20px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 18px;border-radius:26px;font-weight:600;font-size:15px;animation:up .45s cubic-bezier(.22,1.2,.36,1) both}
.toast button{min-height:36px;padding:0 14px;border-radius:18px;color:#fff;background:var(--indigo);font-weight:700}
/* saved */
.saved{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(28,26,51,.14);animation:fade .25s both}
.saved div{display:flex;flex-direction:column;align-items:center;gap:22px}
.drop{position:relative;width:92px;height:92px}
.drop i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(79,70,216,.5);animation:ripple 1.3s ease-out both}
.drop i:nth-child(2){animation-delay:.18s}.drop i:nth-child(3){animation-delay:.36s}
@keyframes ripple{from{transform:scale(.6);opacity:.9}to{transform:scale(2.6);opacity:0}}
.drop u{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;text-decoration:none;background:linear-gradient(150deg,#8a86f8,#4f46d8);box-shadow:0 12px 30px rgba(79,70,216,.5);animation:land .55s cubic-bezier(.34,1.56,.64,1) both}
@keyframes land{from{transform:scale(.2)}to{transform:scale(1)}}
.saved p{font-family:var(--display);font-size:20px;font-weight:700;padding:10px 20px;border-radius:24px;animation:rise .5s .25s both}
/* ringing */
.ring{position:absolute;inset:0;z-index:50;color:#fff;background:#0c0a1f;display:flex;flex-direction:column;overflow:hidden;animation:fade .4s both}
.ring .n1,.ring .n2,.ring .n3{position:absolute;border-radius:50%;filter:blur(50px);animation:drift 14s ease-in-out infinite alternate}
.ring .n1{left:-80px;top:-60px;width:340px;height:340px;background:#4a3fd8;opacity:.75}
.ring .n2{right:-100px;top:34%;width:300px;height:300px;background:#8b4fe0;opacity:.55;animation-duration:19s}
.ring .n3{left:-40px;bottom:-40px;width:320px;height:320px;background:#ff7a6b;opacity:.4;animation-duration:23s}
.rr{position:absolute;left:50%;top:38%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;border:2px solid rgba(180,170,255,.55);animation:rip 4.8s ease-out infinite}
.rr:nth-of-type(2){animation-delay:-1.6s}.rr:nth-of-type(3){animation-delay:-3.2s}
@keyframes rip{from{transform:scale(.6);opacity:.9}to{transform:scale(3.4);opacity:0}}
.rbody{position:relative;flex:1;display:flex;flex-direction:column;padding:70px 16px 36px}
.rtxt{text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
.rtxt .d{font-size:16px;font-weight:500;color:rgba(255,255,255,.8)}

  el.innerHTML = '<div class="n1"></div><div class="n2"></div><div class="n3"></div><i class="rr"></i><i class="rr"></i><i class="rr"></i><div class="rbody"><div class="rtxt"><div class="d">' + longDate(now) + '</div><div class="t">' + p.t + (p.ap ? '<small>' + p.ap + '</small>' : '') + '</div><div class="l">' + esc(r.label || r.alarm.label) + '</div></div><div style="flex:1"></div>' +
    (alarm ? '<button class="snz dg" data-act="snooze">' + ic('moon', 22) + 'Snooze ' + (r.alarm.snooze || 9) + ' min</button>' : '') +
    '<div class="trk dg" id="trk"><span>Slide to stop</span><button class="hnd" id="hnd" aria-label="Stop">' + ic('arrow', 28, 2.2) + '</button></div></div>';
  $('#app').appendChild(el);
  const hnd = $('#hnd'), trk = $('#trk'); let x0 = null, dx = 0;
  const max = () => trk.clientWidth - hnd.offsetWidth - 12;
  hnd.addEventListener('pointerdown', e => { x0 = e.clientX; hnd.setPointerCapture(e.pointerId); hnd.style.transition = 'none'; });
  hnd.addEventListener('pointermove', e => { if (x0 === null) return; dx = Math.min(Math.max(0, e.clientX - x0), max()); hnd.style.transform = 'translateX(' + dx + 'px)'; });
  const end = () => { if (x0 === null) return; x0 = null; if (dx > max() * 0.85) stopRing(); else { hnd.style.transition = 'transform .5s cubic-bezier(.34,1.56,.64,1)'; hnd.style.transform = 'none'; dx = 0; } };
  hnd.addEventListener('pointerup', end); hnd.addEventListener('pointercancel', end);
  hnd.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') stopRing(); });
}
function closeRing() { const el = $('#ring'); if (el) el.remove(); ringing = null; stopAlarmSound(); }
function stopRing() {
  const r = ringing; closeRing(); fx.saved();
  if (r && r.kind === 'alarm') { const a = findAlarm(r.alarm.id); if (a && !a.weekdays.length) { a.enabled = false; persist(); } }
  if (r && r.kind === 'timer') { state.timer = null; persist(); }
  render();
}
function snoozeRing() {
  const r = ringing; if (!r || r.kind !== 'alarm') return;
  const mins = r.alarm.snooze || 9, at = new Date(Date.now() + mins * 60000);
  state.snoozes.push({ id: uid(), at: at.getTime(), alarm: { ...r.alarm, hour: at.getHours(), minute: at.getMinutes(), id: r.alarm.id } });
  persist(); closeRing(); toast('Snoozed for ' + mins + ' min'); fx.tick();
}

/* ---------- the clock ---------- */
function shouldRing(a, now) {
  if (!a.enabled || a.hour !== now.getHours() || a.minute !== now.getMinutes()) return false;
  if (a.weekdays.length) return a.weekdays.includes(now.getDay() + 1);
  return a.date ? a.date === dateKey(now) : true;
}
function updateHero() {
  const h = $('#hero'); if (!h || ui.tab !== 'week') return;
  const n = nextAlarm(), on = state.alarms.filter(a => a.enabled).length;
  h.querySelector('.big').textContent = n ? fullTime(n.a) : 'No alarms on';
  h.querySelector('.sub').textContent = n ? n.a.label + ', in ' + countdown((n.f - Date.now()) / 1000) : 'Turn one on or add a new one';
  h.querySelector('.cnt b').textContent = on;
}
let ticks = 0;
function tick() {
  const now = new Date(), key = dateKey(now) + ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes());
  if (!ringing) {
    for (const a of state.alarms) if (shouldRing(a, now) && fired[a.id] !== key) { fired[a.id] = key; openRing({ kind: 'alarm', alarm: a, label: a.label }); break; }
    if (!ringing) {
      const i = state.snoozes.findIndex(s => s.at <= Date.now());
      if (i >= 0) { const [s] = state.snoozes.splice(i, 1); persist(); openRing({ kind: 'alarm', alarm: s.alarm, label: s.alarm.label }); }
    }
    if (!ringing && state.timer && tFinished() && !state.timer.notified) timerDone();
  }
  if (!ringing) expireOneOffs();
  if (++ticks % 15 === 0) updateHero();
}

/* ---------- events ---------- */
function toggleAlarm(id) {
  const a = findAlarm(id); if (!a) return;
  a.enabled = !a.enabled; persist(); a.enabled ? fx.on() : fx.off();
  document.querySelectorAll('[data-card="' + id + '"]').forEach(c => {
    c.querySelector('.tog').setAttribute('aria-checked', String(a.enabled));
    c.querySelector('.acard').classList.toggle('off', !a.enabled);
    c.querySelector('.dot').classList.toggle('on', a.enabled);
  });
  updateHero();
}
function deleteAlarm(id) {
  const i = state.alarms.findIndex(a => a.id === id); if (i < 0) return;
  const [a] = state.alarms.splice(i, 1); persist(); fx.del(); render();
  toast('Deleted ' + a.label, () => { upsert(a); fx.tick(); render(); });
}
const acts = {
  tab(t) { ui.tab = t.dataset.tab; fx.tick(); render(true); },
  new(t) { fx.tick(); openEditor(null, t.dataset.date || (ui.tab === 'schedule' ? dateKey(ui.monthSel) : ui.tab === 'plans' && !sameDay(ui.planSel, new Date()) ? dateKey(ui.planSel) : ui.tab === 'week' && !sameDay(ui.weekSel, new Date()) ? dateKey(ui.weekSel) : null)); },
  ai() { fx.tick(); openAI(); },
  edit(t) { const a = findAlarm(t.dataset.id); if (a) { fx.tick(); openEditor(a); } },
  toggle(t) { toggleAlarm(t.dataset.id); },
  del(t) { deleteAlarm(t.dataset.id); },
  weekday(t) { ui.weekSel = fromKey(t.dataset.day); fx.tick(); render(true); },
  monthday(t) { ui.monthSel = fromKey(t.dataset.day); fx.tick(); render(true); },
  prevmonth() { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() - 1, 1); fx.tick(); render(true); },
  nextmonth() { ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + 1, 1); fx.tick(); render(true); },
  prevday() { ui.planSel = addDays(ui.planSel, -1); fx.tick(); render(true); },
  nextday() { ui.planSel = addDays(ui.planSel, 1); fx.tick(); render(true); },
  today() { ui.planSel = startOfDay(new Date()); fx.tick(); render(true); },
  preset(t) { const s = +t.dataset.s; ui.draft.h = Math.floor(s / 3600); ui.draft.m = Math.floor((s % 3600) / 60); ui.draft.s = s % 60; fx.tick(); render(); },
  tstart() { const lab = ($('#tl-label') && $('#tl-label').value.trim()) || 'Timer'; ui.draft.label = lab; startTimer(lab, chosenSeconds()); fx.saved(); render(); },
  tpause() { const t = state.timer; if (!t) return; if (t.left != null) { t.end = Date.now() + t.left * 1000; t.left = null; } else { t.left = tRemaining(); t.end = null; } persist(); fx.tick(); render(); },
  tplus() { const t = state.timer; if (!t) return; if (t.left != null) t.left += 60; else t.end += 60000; t.total += 60; persist(); fx.tick(); render(); },
  tcancel() { state.timer = null; persist(); fx.del(); render(); },
  tdone() { stopAlarmSound(); state.timer = null; persist(); render(); },
  testring() { const n = nextAlarm(); openRing({ kind: 'alarm', alarm: n ? n.a : mk('Get ready for office', 5, 30, [2, 3, 4, 5, 6], null, true, 0), label: n ? n.a.label : 'Get ready for office' }); },
  reset() { state = seed(); persist(); render(true); toast('Sample alarms restored'); },
  closesheet() { closeSheet(); },
  edday(t) { const n = +t.dataset.n, a = editor.a, i = a.weekdays.indexOf(n); if (i >= 0) a.weekdays.splice(i, 1); else a.weekdays.push(n); t.setAttribute('aria-pressed', String(i < 0)); fx.tick(); syncOnce(); },
  edhasdate() { editor.hasDate = !editor.hasDate; fx.tick(); syncOnce(); },
  edai() { editorFill(); },
  edsave() { saveEditor(); },
  eddel() { const id = editor.a.id; closeSheet(); deleteAlarm(id); },
  aiex(t) { ai.text = ai.ex[+t.dataset.i]; $('#ai-text').value = ai.text; ai.removed = new Set(); fx.tick(); renderAI(); },
  airm(t) { const i = +t.dataset.i; ai.removed.has(i) ? ai.removed.delete(i) : ai.removed.add(i); fx.tick(); renderAI(); },
  aiadd() { applyAI(); },
  snooze() { snoozeRing(); }
};
$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const f = acts[t.dataset.act]; if (f) f(t);
});
$('#app').addEventListener('input', e => {
  const id = e.target.id;
  if (id === 'th' || id === 'tm' || id === 'ts') {
    const v = Math.max(0, Math.min(id === 'th' ? 23 : 59, parseInt(e.target.value, 10) || 0));
    ui.draft[id === 'th' ? 'h' : id === 'tm' ? 'm' : 's'] = v;
    const s = chosenSeconds(), vt = $('#vtime'); if (vt) vt.textContent = clock(s);
    const go = $('[data-act="tstart"]'); if (go) go.disabled = s < 1;
    document.querySelectorAll('[data-act="preset"]').forEach(b => b.classList.toggle('sel', +b.dataset.s === s));
  } else if (id === 'tl-label') { ui.draft.label = e.target.value; const c = $('#vcap'); if (c) c.textContent = e.target.value || 'Timer'; }
  else if (id === 'ai-text' && ai) { ai.text = e.target.value; ai.removed = new Set(); renderAI(); }
});
$('#app').addEventListener('keydown', e => {
  if (e.key === 'Escape' && $layer.firstChild) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'ed-ai') { e.preventDefault(); editorFill(); }
});

/* ---------- go ---------- */
expireOneOffs(); render(true);
setInterval(tick, 1000); requestAnimationFrame(loop);
})();
